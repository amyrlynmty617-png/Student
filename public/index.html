<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student AI</title>

<style>
body{
    font-family:tahoma;
    background:#f1f5f9;
    margin:0;
}

.box{
    max-width:500px;
    background:white;
    margin:30px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px #ccc;
}

input,textarea,button{
    width:100%;
    padding:12px;
    margin:7px 0;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    background:#2563eb;
    color:white;
    border:0;
    cursor:pointer;
}

.hidden{
    display:none;
}

.card{
    background:#f8fafc;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    white-space:pre-wrap;
}

h2{
    text-align:center;
}
</style>

</head>

<body>


<div class="box" id="loginBox">

<h2>ورود به Student AI</h2>

<input id="username" placeholder="نام کاربری">

<input id="password" type="password" placeholder="رمز عبور">

<button onclick="login()">ورود</button>

<div id="loginMsg"></div>

</div>



<div class="box hidden" id="panel">

<h2>پنل دانش‌آموز</h2>

<p id="userInfo"></p>


<textarea id="question" rows="5"
placeholder="سؤال خود را بنویسید"></textarea>


<button onclick="askAI()">
ارسال به هوش مصنوعی
</button>


<div class="card" id="answer">
پاسخ اینجا نمایش داده می‌شود
</div>


<h3>تاریخچه سوالات</h3>

<div id="history"></div>


<button onclick="logout()">
خروج
</button>


</div>



<script>

let token="";


async function login(){

let res=await fetch("/api/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:username.value,

password:password.value

})

});


let data=await res.json();


if(data.token){

token=data.token;

localStorage.token=token;

loadUser();

}else{

loginMsg.innerText=data.error || "خطا";

}

}



async function loadUser(){

let res=await fetch("/api/me",{

headers:{

Authorization:"Bearer "+token

}

});


let data=await res.json();


if(data.user){

loginBox.classList.add("hidden");

panel.classList.remove("hidden");


userInfo.innerText=
"سلام "+data.user.name+
" | پایه: "+data.user.grade;


history.innerHTML="";


data.user.history.forEach(item=>{

history.innerHTML+=`

<div class="card">

درس: ${item.subject}

<br>

سؤال:
${item.question}

<br><br>

پاسخ:
${item.answer}

</div>

`;

});


}

}



async function askAI(){

answer.innerText="در حال پردازش...";


let res=await fetch("/api/solve",{

method:"POST",

headers:{

"Content-Type":"application/json",

Authorization:"Bearer "+token

},

body:JSON.stringify({

question:question.value,

subject:"عمومی",

level:"کامل و آموزشی"

})

});


let data=await res.json();


answer.innerText=
data.answer || data.error;

loadUser();

}



function logout(){

localStorage.removeItem("token");

location.reload();

}


window.onload=()=>{

let t=localStorage.token;

if(t){

token=t;

loadUser();

}

}

</script>


</body>
</html>
