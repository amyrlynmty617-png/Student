<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student AI</title>

<style>
body{
font-family:tahoma;
background:#f1f5f9;
margin:0;
}

.box{
max-width:420px;
background:white;
margin:40px auto;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #ccc;
}

input,button{
width:100%;
padding:12px;
margin:7px 0;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:#2563eb;
color:white;
border:0;
}

h2{
text-align:center;
}

.hidden{
display:none;
}

.msg{
margin-top:10px;
text-align:center;
}
</style>

</head>

<body>


<div class="box" id="authBox">

<h2>🎓 Student AI</h2>


<div id="login">

<h3>ورود</h3>

<input id="loginUser" placeholder="نام کاربری">

<input id="loginPass" type="password" placeholder="رمز عبور">

<button onclick="login()">
ورود
</button>

</div>



<hr>


<div id="register">

<h3>ثبت نام</h3>


<input id="regName" placeholder="نام و نام خانوادگی">

<input id="regUser" placeholder="نام کاربری">

<input id="regPass" type="password" placeholder="رمز عبور">

<input id="regGrade" placeholder="پایه تحصیلی">

<input id="regMajor" placeholder="رشته">


<button onclick="register()">
ثبت نام
</button>


</div>


<div class="msg" id="msg"></div>

</div>



<div class="box hidden" id="panel">

<h2>ورود موفق</h2>

<p id="welcome"></p>

<button onclick="logout()">
خروج
</button>

</div>



<script>


let token="";



async function register(){


let res=await fetch("/api/auth/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:regName.value,

username:regUser.value,

password:regPass.value,

grade:regGrade.value,

major:regMajor.value

})

});


let data=await res.json();


if(data.token){

msg.innerText="ثبت نام موفق شد";

token=data.token;

localStorage.token=token;

showPanel();

}else{

msg.innerText=data.error || "خطا";

}


}





async function login(){


let res=await fetch("/api/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:loginUser.value,

password:loginPass.value

})

});


let data=await res.json();



if(data.token){

token=data.token;

localStorage.token=token;

msg.innerText="ورود موفق شد";

showPanel();


}else{

msg.innerText=data.error || "خطا";

}


}




async function showPanel(){


authBox.classList.add("hidden");

panel.classList.remove("hidden");


let res=await fetch("/api/me",{

headers:{
Authorization:"Bearer "+token
}

});


let data=await res.json();


if(data.user){

welcome.innerText=
"سلام "+data.user.name;

}


}



function logout(){

localStorage.removeItem("token");

location.reload();

}




window.onload=()=>{

let t=localStorage.token;

if(t){

token=t;

showPanel();

}

}



</script>


</body>
</html>
